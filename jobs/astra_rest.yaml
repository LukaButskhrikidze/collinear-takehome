# Astra-only: the 2 remaining scored Astra attempts, if Hy4's main trial times out (gen/after_hy4.sh)
job_name: astra_rest
jobs_dir: runs
n_attempts: 2
# colima VM has 4 CPUs / 8 GB; each trial needs 3 CPUs / 6 GB -> one trial at a time
n_concurrent_trials: 1
retry:
  max_retries: 0
environment:
  type: docker
  force_build: false
  delete: true
agents:
  - name: opencode
    model_name: "openrouter/openai/gpt-6-astra"
    override_setup_timeout_sec: 900
    kwargs:
      version: "1.18.31"
      opencode_config:
        small_model: "openrouter/openai/gpt-6-astra"
        provider:
          openrouter:
            models:
              "openai/gpt-6-astra":
                options:
                  reasoning:
                    effort: max
tasks:
  - path: task
