schema_version = "1.1"

[task]
name = "butskhl/experimental-ensemble"
description = "Build a protein's experimental monomer ensemble from raw PDB entries; report its size and shared core."
authors = []
keywords = ["protein-structure", "pdb", "conformational-ensemble"]

[metadata]
author_name = "Luka Butskhrikidze"
author_email = "luka.butskhrikidze@vanderbilt.edu"
difficulty = "hard"
category = "structural-biology"
tags = ["protein-structure", "pdb", "uniprot"]

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 3600.0
# Agent phase only: model API reachable, nothing else (no RCSB/SIFTS/UniProt lookups).
# Setup (opencode install) runs before this switch, on the public baseline below.
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai", "models.dev"]

[environment]
build_timeout_sec = 1200.0
cpus = 3
memory_mb = 6144
storage_mb = 10240
gpus = 0
mcp_servers = []

[verifier.env]

[environment.env]

[solution.env]
